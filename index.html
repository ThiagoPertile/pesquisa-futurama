<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa futurama</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Pesquisa online</h1>
    </header>
    <section>
        <!-- method GET deixa os dados visiveis na url -->
        <!-- method POST manda os dados como header para o BACK-END -->
        <form action="" method="get">
            <fieldset class="personal-info">
                <legend>Informações pessoais</legend>
                <!-- campo nome -->
                <label for="userName">Nome:</label>
                <input type="text" id="userName" name="userName" placeholder="Digite seu nome" required>
                <!-- campo idade -->
                <label for="userAge">Idade</label>
                <input type="number" id="userAge" name="userAge" placeholder="idade" min="12" max="100" required>

                <!-- data de nascimento -->
                <label for="birthDate">Data de nascimento</label>
                <input type="date" id="birthDate" name="birthDate">

                <!-- email -->
                <label for="userEmail">Email</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="Digite seu email" required>

                <!-- telefone -->
                <label for="userPhone">Telefone</label>
                <input type="tel" id="userPhone" name="userPhone" placeholder="62981564879" pattern="[0-9]{11}"
                    required>

                <!-- Imagem -->
                <label for="userImg">Upload de imagem</label>
                <input type="file" accept="image/*" id="userImg" name="userImg">

            </fieldset>
            <!-- botao de submit -->
            <button type="submit">Pesquisar</button>

        </form>
    </section>
</body>

</html>
